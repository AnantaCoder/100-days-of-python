<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #0ff;
            --neon-pink: #f0f;
            --bg-dark: #0a0a0a;
            --cell-size: 100px;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .game-title {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
            animation: neonFlicker 1.5s infinite alternate;
            text-shadow: 
                0 0 7px var(--neon-blue),
                0 0 10px var(--neon-blue),
                0 0 21px var(--neon-blue),
                0 0 42px var(--neon-blue);
        }

        .game-status {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            gap: 5px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .cell {
            background: var(--bg-dark);
            border: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover:not(.marked) {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .cell.x {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .cell.o {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .reset-button {
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow:
                    0 0 7px var(--neon-blue),
                    0 0 10px var(--neon-blue),
                    0 0 21px var(--neon-blue),
                    0 0 42px var(--neon-blue);
            }
            20%, 22%, 24%, 55% {
                text-shadow: none;
            }
        }

        @media (max-width: 480px) {
            :root {
                --cell-size: 80px;
            }

            .game-title {
                font-size: 2rem;
            }

            .game-status {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <h1 class="game-title">Tic Tac Toe</h1>
    <div class="game-status"></div>
    <div class="board">
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
    </div>
    <button class="reset-button">Reset Game</button>

    <script>
        const gameStatus = document.querySelector('.game-status');
        const cells = document.querySelectorAll('[data-cell]');
        const resetButton = document.querySelector('.reset-button');
        let currentPlayer = 'x';
        let gameActive = true;
        let gameState = ['', '', '', '', '', '', '', '', ''];

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]              
        ];

        function handleCellClick(e) {
            const cell = e.target;
            const cellIndex = Array.from(cells).indexOf(cell);

            if (gameState[cellIndex] !== '' || !gameActive) return;

            gameState[cellIndex] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer, 'marked');

            if (checkWin()) {
                gameActive = false;
                gameStatus.textContent = `Player ${currentPlayer.toUpperCase()} wins!`;
                return;
            }

            if (checkDraw()) {
                gameActive = false;
                gameStatus.textContent = "It's a draw!";
                return;
            }

            currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
            gameStatus.textContent = `Player ${currentPlayer.toUpperCase()}'s turn`;
        }

        function checkWin() {
            return winningCombinations.some(combination => {
                return combination.every(index => {
                    return gameState[index] === currentPlayer;
                });
            });
        }

        function checkDraw() {
            return gameState.every(cell => cell !== '');
        }

        function resetGame() {
            gameState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'x';
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o', 'marked');
            });
            gameStatus.textContent = "Player X's turn";
        }

        // Initialize game
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', resetGame);
        gameStatus.textContent = "Player X's turn";
    </script>
</body>
</html>
